<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pelacak Gerakan Tangan</title>
<style>
  :root{
    --ink: #111111;
    --ink-soft: #5a5a5a;
    --glass: rgba(255,255,255,0.6);
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'IBM Plex Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
  }
  body{
    font-family:var(--sans);
    color:var(--ink);
  }

  .stage{
    position:fixed;
    inset:0;
    background: linear-gradient(160deg, #ffffff, #ececec);
    overflow:hidden;
  }
  video{ display:none; }
  canvas#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    transform:scaleX(-1);
    filter:grayscale(1) contrast(1.05);
  }

  .placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    color:#b6b6b6;
  }
  .placeholder .icon-wrap{
    width:60px; height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--glass);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .placeholder svg{ width:26px; height:26px; opacity:0.7; color:var(--ink-soft); }
  .placeholder span{ font-size:0.8rem; color:var(--ink-soft); }

  .readout{
    position:absolute;
    top:env(safe-area-inset-top, 14px); left:14px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.66rem;
    font-weight:500;
    color:var(--ink);
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:5px 9px 5px 7px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
    z-index:3;
    margin-top:6px;
  }
  .readout.show{ opacity:1; transform:translateY(0); }
  .readout .dot{
    width:5px; height:5px;
    border-radius:50%;
    background:var(--ink);
    flex-shrink:0;
  }

  .code-overlay{
    position:absolute;
    top:calc(env(safe-area-inset-top, 14px) + 6px); right:14px;
    max-width:54%;
    padding:9px 10px;
    background:rgba(17,17,17,0.68);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    font-family:var(--mono);
    font-size:0.56rem;
    line-height:1.5;
    color:#f2f2f2;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    white-space:nowrap;
    overflow:hidden;
    z-index:3;
  }
  .code-overlay.show{ opacity:1; transform:translateY(0); }
  .code-line{ overflow:hidden; text-overflow:ellipsis; }
  .code-line .key{ color:#9c9c9c; }
  .code-line .punc{ color:rgba(255,255,255,0.3); }

  .ticker{
    position:absolute;
    left:14px; right:14px; bottom:calc(env(safe-area-inset-bottom, 0px) + 96px);
    height:36px;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .25s ease, transform .25s ease;
    z-index:3;
  }
  .ticker.show{ opacity:1; transform:translateY(0); }
  .ticker canvas{ width:100%; height:100%; display:block; }

  .controls{
    position:absolute;
    left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 22px);
    display:flex;
    justify-content:center;
    z-index:4;
  }
  .shutter{
    width:46px;
    height:46px;
    border-radius:50%;
    border:2px solid rgba(17,17,17,0.85);
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    cursor:pointer;
  }
  .shutter .inner{
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--ink);
    transition:all .2s ease;
  }
  .shutter.active .inner{
    width:16px;
    height:16px;
    border-radius:5px;
  }

  .error{
    position:absolute;
    left:14px; right:14px;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 78px);
    display:none;
    padding:9px 12px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    color:var(--ink);
    font-size:0.75rem;
    line-height:1.5;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    z-index:4;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
  <div class="placeholder" id="placeholder">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4.5M12 10V4.5a1.5 1.5 0 0 1 3 0V11M15 10.5v-2a1.5 1.5 0 0 1 3 0v6.5c0 3.3-2.7 6-6 6h-1c-2 0-3-.6-4.3-2.1L3.6 15c-.6-.7-.5-1.7.2-2.3.6-.5 1.5-.5 2.1.1L7.5 14.5V7a1.5 1.5 0 0 1 3 0v4.5"/>
      </svg>
    </div>
    <span>Kamera belum aktif</span>
  </div>
  <div class="readout" id="readout">
    <span class="dot"></span>
    <span id="readoutText">0 tangan</span>
  </div>
  <div class="code-overlay" id="codeOverlay">
    <div class="code-line" id="codeLine0">·</div>
    <div class="code-line" id="codeLine1">·</div>
    <div class="code-line" id="codeLine2">·</div>
    <div class="code-line" id="codeLine3">·</div>
  </div>
  <div class="ticker" id="ticker">
    <canvas id="tickerCanvas"></canvas>
  </div>
  <div class="error" id="errorBox"></div>
  <div class="controls">
    <button class="shutter" id="toggleBtn"><span class="inner"></span></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const stageEl = document.getElementById('stage');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
const readout = document.getElementById('readout');
const readoutText = document.getElementById('readoutText');
const codeOverlay = document.getElementById('codeOverlay');
const codeLines = [
  document.getElementById('codeLine0'),
  document.getElementById('codeLine1'),
  document.getElementById('codeLine2'),
  document.getElementById('codeLine3')
];
const ticker = document.getElementById('ticker');
const tickerCanvas = document.getElementById('tickerCanvas');
const tctx = tickerCanvas.getContext('2d');
const toggleBtn = document.getElementById('toggleBtn');
const errorBox = document.getElementById('errorBox');

let camera = null;
let hands = null;
let stream = null;
let running = false;
let prevLandmarks = null;

// resolusi logis canvas mengikuti ukuran layar penuh saat ini
let CANVAS_W = window.innerWidth;
let CANVAS_H = window.innerHeight;

function updateCanvasSize(){
  const rect = stageEl.getBoundingClientRect();
  CANVAS_W = Math.round(rect.width);
  CANVAS_H = Math.round(rect.height);
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;
}
updateCanvasSize();
window.addEventListener('resize', updateCanvasSize);

// --- sparkline pergerakan ---
const HISTORY_LEN = 60;
const history = new Array(HISTORY_LEN).fill(0);

function resizeTickerCanvas(){
  const rect = tickerCanvas.getBoundingClientRect();
  tickerCanvas.width = rect.width * devicePixelRatio;
  tickerCanvas.height = rect.height * devicePixelRatio;
}
window.addEventListener('resize', resizeTickerCanvas);

function drawTicker(){
  const w = tickerCanvas.width;
  const h = tickerCanvas.height;
  tctx.clearRect(0,0,w,h);
  const pad = 6 * devicePixelRatio;
  const usableH = h - pad*2;
  const step = w / (HISTORY_LEN - 1);

  tctx.beginPath();
  history.forEach((v, i) => {
    const x = i * step;
    const y = pad + (1 - Math.min(1,v)) * usableH;
    if (i === 0) tctx.moveTo(x,y); else tctx.lineTo(x,y);
  });
  tctx.strokeStyle = '#111111';
  tctx.lineWidth = 1.6 * devicePixelRatio;
  tctx.lineJoin = 'round';
  tctx.stroke();

  const lastX = (HISTORY_LEN-1) * step;
  const lastY = pad + (1 - Math.min(1,history[HISTORY_LEN-1])) * usableH;
  tctx.beginPath();
  tctx.arc(lastX, lastY, 2.4 * devicePixelRatio, 0, Math.PI*2);
  tctx.fillStyle = '#111111';
  tctx.fill();
}

function pushMovement(magnitude){
  history.shift();
  history.push(Math.min(1, magnitude));
  drawTicker();
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

function countExtendedFingers(landmarks){
  let count = 0;
  if (Math.abs(landmarks[4].x - landmarks[0].x) > Math.abs(landmarks[3].x - landmarks[0].x)) count++;
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  for (let i = 0; i < tips.length; i++){
    if (landmarks[tips[i]].y < landmarks[pips[i]].y) count++;
  }
  return count;
}

function fmt(n){ return n.toFixed(3); }

function renderCode(landmarks){
  const points = [
    ['wrist', landmarks[0]],
    ['thumb', landmarks[4]],
    ['index', landmarks[8]],
    ['middle', landmarks[12]]
  ];
  points.forEach(([name, p], i) => {
    codeLines[i].innerHTML =
      `<span class="key">${name}</span><span class="punc">:</span> x${fmt(p.x)} y${fmt(p.y)} z${fmt(p.z)}`;
  });
}

function clearCode(){
  codeLines.forEach(el => { el.textContent = '·'; });
}

function getCoverRect(vw, vh){
  const canvasAspect = CANVAS_W / CANVAS_H;
  const videoAspect = vw / vh;
  let sx, sy, sw, sh;
  if (videoAspect > canvasAspect){
    sh = vh;
    sw = vh * canvasAspect;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    sw = vw;
    sh = vw / canvasAspect;
    sx = 0;
    sy = (vh - sh) / 2;
  }
  return { sx, sy, sw, sh };
}

function remapLandmarks(landmarks, vw, vh, rect){
  return landmarks.map(p => ({
    x: (p.x * vw - rect.sx) / rect.sw,
    y: (p.y * vh - rect.sy) / rect.sh,
    z: p.z
  }));
}

function onResults(results){
  const vw = video.videoWidth || CANVAS_W;
  const vh = video.videoHeight || CANVAS_H;
  const rect = getCoverRect(vw, vh);

  ctx.save();
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  ctx.drawImage(results.image, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, CANVAS_W, CANVAS_H);

  const rawHandList = results.multiHandLandmarks || [];
  const handList = rawHandList.map(lm => remapLandmarks(lm, vw, vh, rect));

  if (handList.length > 0){
    const fingerCounts = [];
    for (const landmarks of handList){
      window.drawConnectors(ctx, landmarks, window.HAND_CONNECTIONS, {
        color: 'rgba(17,17,17,0.55)',
        lineWidth: 2
      });
      window.drawLandmarks(ctx, landmarks, {
        color: '#ffffff',
        fillColor: '#111111',
        lineWidth: 1.5,
        radius: 3
      });
      fingerCounts.push(countExtendedFingers(landmarks));
    }
    readoutText.textContent = `${handList.length} tangan · ${fingerCounts.join('+')} jari`;
    renderCode(handList[0]);

    const current = handList[0];
    if (prevLandmarks){
      let total = 0;
      for (let i = 0; i < current.length; i++){
        const dx = current[i].x - prevLandmarks[i].x;
        const dy = current[i].y - prevLandmarks[i].y;
        total += Math.sqrt(dx*dx + dy*dy);
      }
      const avg = total / current.length;
      pushMovement(avg * 18);
    }
    prevLandmarks = current.map(p => ({ x: p.x, y: p.y }));
  } else {
    readoutText.textContent = '0 tangan';
    clearCode();
    prevLandmarks = null;
    pushMovement(0);
  }
  ctx.restore();
}

async function start(){
  errorBox.style.display = 'none';
  toggleBtn.disabled = true;

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 854, facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    toggleBtn.disabled = false;
    showError('Tidak bisa mengakses kamera. Pastikan izin kamera diberikan, dan halaman diakses lewat HTTPS atau localhost.');
    return;
  }

  updateCanvasSize();
  placeholder.style.display = 'none';
  readout.classList.add('show');
  codeOverlay.classList.add('show');
  ticker.classList.add('show');
  resizeTickerCanvas();
  drawTicker();

  hands = new window.Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });
  hands.onResults(onResults);

  camera = new window.Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 480,
    height: 854
  });
  camera.start();

  running = true;
  toggleBtn.classList.add('active');
  toggleBtn.disabled = false;
}

function stop(){
  if (camera) { camera.stop(); camera = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  placeholder.style.display = 'flex';
  readout.classList.remove('show');
  codeOverlay.classList.remove('show');
  ticker.classList.remove('show');
  readoutText.textContent = '0 tangan';
  clearCode();
  prevLandmarks = null;
  history.fill(0);
  drawTicker();
  running = false;
  toggleBtn.classList.remove('active');
}

toggleBtn.addEventListener('click', () => {
  if (running) stop(); else start();
});
</script>

</body>
</html>
